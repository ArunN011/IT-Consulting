<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Stackly</title>

    <link rel="icon" href="Assets/blacklogo.webp">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="error.css">
</head>

<body>

    <header class="error-header">
        <div class="error-header-inner">
            <a href="index.html" class="error-logo">
                <img src="Assets/blacklogo.webp" alt="Stackly">
            </a>

            <a href="index.html" class="error-home-link">
                HOME
            </a>
        </div>
    </header>

    <main class="error-page">

        <div class="error-background-number">404</div>

        <div class="error-content">

            <span class="error-label">
                (404) — PAGE NOT FOUND
            </span>

            <div class="error-divider"></div>

            <h1 class="error-title">
                THIS PAGE
                <span>DOESN'T EXIST.</span>
            </h1>

            <p class="error-description">
                The page you're looking for may have been moved,
                deleted, or the URL may be incorrect.
            </p>

            <div class="error-buttons">

                <button type="button" class="error-btn error-btn-back" id="backButton">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>GO BACK</span>
                </button>

                <a href="index.html" class="error-btn error-btn-home">
                    <span>BACK TO HOME</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>

            </div>

        </div>

        <div class="error-bottom">
            <span>STACKLY / DIGITAL ENGINEERING</span>
            <span>2026</span>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="error.js"></script>

</body>
</html>
